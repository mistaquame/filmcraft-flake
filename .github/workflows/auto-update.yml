name: Auto-update FilmCraft

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check upstream, update flake.nix, build, push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Upstream tags look like "v0.13.0"; the flake stores "0.13.0".
          latest=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/storytold/filmcraft/releases/latest \
            | jq -r .tag_name | sed 's/^v//')
          current=$(grep -oP '^\s*version = "\K[^"]+' flake.nix)
          echo "upstream: $latest, flake: $current"

          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "could not determine latest release" >&2; exit 1
          fi
          if [ "$latest" = "$current" ]; then
            echo "up to date"; exit 0
          fi

          url="https://github.com/storytold/filmcraft/releases/download/v${latest}/filmcraft-${latest}-linux-x86_64.tar.gz"
          hash=$(nix store prefetch-file --json "$url" | jq -r .hash)   # SRI: sha256-...
          echo "new hash: $hash"

          sed -i -E "s|^(\s*version = \")[^\"]+|\1${latest}|" flake.nix
          sed -i -E "s|(\"x86_64-linux\" = \")[^\"]+|\1${hash}|" flake.nix

          # Only push if the package actually builds.
          nix build .#default --no-link

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "filmcraft: update to v${latest}"
          git push origin HEAD:main
