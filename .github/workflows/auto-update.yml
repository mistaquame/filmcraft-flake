name: Auto-update FilmCraft

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-install-action@v9

      - name: Set up Nix cache
        uses: DeterminateSystems/magic-nix-cache@v8

      - name: Check for new upstream release
        id: upstream
        run: |
          latest=$(curl -s https://api.github.com/repos/storytold/filmcraft/releases/latest | grep '"tag_name"' | sed 's/.*"tag_name": *"//;s/".*//')
          echo "latest upstream tag: $latest"
          current=$(grep -oP 'filmcraftVersion = "\K[^"]+' flake.nix)
          echo "current flake version: $current"
          if [ "$latest" = "$current" ]; then
            echo "up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "new release available: $latest"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch tarball hashes
        if: steps.upstream.outputs.changed == 'true'
        id: hashes
        run: |
          version="${{ steps.upstream.outputs.version }}"
          curl -sL -o /tmp/x86_64.tar.gz \
            "https://github.com/storytold/filmcraft/releases/download/v${version}/filmcraft-${version}-linux-x86_64.tar.gz"
          curl -sL -o /tmp/aarch64.tar.gz \
            "https://github.com/storytold/filmcraft/releases/download/v${version}/filmcraft-${version}-linux-aarch64.tar.gz"
          x86_64_hash=$(sha256sum /tmp/x86_64.tar.gz | awk '{print $1}')
          aarch64_hash=$(sha256sum /tmp/aarch64.tar.gz | awk '{print $1}')
          echo "x86_64=$x86_64_hash" >> "$GITHUB_OUTPUT"
          echo "aarch64=$aarch64_hash" >> "$GITHUB_OUTPUT"

      - name: Update flake.nix
        if: steps.upstream.outputs.changed == 'true'
        run: |
          version="${{ steps.upstream.outputs.version }}"
          x86_64_hash="${{ steps.hashes.outputs.x86_64 }}"
          aarch64_hash="${{ steps.hashes.outputs.aarch64 }}"
          python3 - "$version" "$x86_64_hash" "$aarch64_hash" <<'PY'
          import re, sys
          version, x86, aarch = sys.argv[1], sys.argv[2], sys.argv[3]
          with open("flake.nix") as f:
              content = f.read()
          content = re.sub(r'filmcraftVersion = "[^"]+"', f'filmcraftVersion = "{version}"', content)
          content = re.sub(r'"x86_64-linux" = "[0-9a-f]+"', f'"x86_64-linux" = "{x86}"', content)
          content = re.sub(r'"aarch64-linux" = "[0-9a-f]+"', f'"aarch64-linux" = "{aarch}"', content)
          with open("flake.nix", "w") as f:
              f.write(content)
          print("Updated flake.nix")
          PY

      - name: Update flake.lock
        if: steps.upstream.outputs.changed == 'true'
        run: |
          nix flake lock --update nixpkgs

      - name: Build packages
        if: steps.upstream.outputs.changed == 'true'
        run: |
          nix build .#defaultPackage.x86_64-linux
          nix build .#defaultPackage.aarch64-linux

      - name: Commit and push
        if: steps.upstream.outputs.changed == 'true'
        run: |
          version="${{ steps.upstream.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock
          git commit -m "filmcraft: update to v${version}" || echo "nothing to commit"
          git push origin HEAD:main

      - name: Create PR if on non-main branch
        if: steps.upstream.outputs.changed == 'true' && github.ref != 'refs/heads/main'
        run: |
          version="${{ steps.upstream.outputs.version }}"
          git checkout -b "auto-update/filmcraft-v${version}"
          git push origin "auto-update/filmcraft-v${version}"
          gh pr create \
            --base main \
            --head "auto-update/filmcraft-v${version}" \
            --title "filmcraft: update to v${version}" \
            --body "Automated update to upstream FilmCraft v${version}." \
            --label "auto-update"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
